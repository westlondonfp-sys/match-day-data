name: Update football data

on:
  schedule:
    # Runs every Monday and Thursday at 7am UTC — after most weekend and
    # midweek fixtures have finished. Adjust the cron expression any time.
    - cron: '0 7 * * 1,4'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Scrape Lincoln City data
        run: npm run scrape:lincoln

      - name: Fetch Non League data
        run: npm run fetch:non-league
        env:
          FWP_API_KEY: ${{ secrets.FWP_API_KEY }}
        continue-on-error: true # don't fail the whole job if this part isn't set up yet

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update football data $(date -u +'%Y-%m-%d')"
          git push
